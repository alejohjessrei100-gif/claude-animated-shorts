for (const x of [-36, -14, 8, 30]) T.lamp(S, x, 7.5);

{ const g = new THREE.Group(); g.position.set(HALL.x - 6.4, 0, -24); g.rotation.y = Math.PI / 2; S.add(g); T.lockers(g, 0, 0, 24, "#4f7fb8", 1); }
