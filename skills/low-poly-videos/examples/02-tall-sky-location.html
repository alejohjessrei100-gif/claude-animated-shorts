<!doctype html>
<!-- WHAT THIS TEACHES: outdoor composition. Horizon in the lower third, huge painted sky, thousands of grass blades as one mesh,
     terrain flattened near the subject, a small figure seen from behind. The upper third stays calm for captions. -->
<html><head><meta charset="utf-8"><title>02 Tall sky</title>
<style>body{margin:0;background:#111;display:grid;place-items:center;height:100vh}canvas{height:min(96vh,calc(96vw*16/9));aspect-ratio:9/16;image-rendering:pixelated}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const W = 270, H = 480, TAU = Math.PI * 2;
let seed = 12345; const R = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;   // seeded: frames repeat exactly
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const grid = new Float32Array(4096).map(R);
const vn = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), u = x - xi, v = y - yi, g = (a, b) => grid[((b & 63) << 6) + (a & 63)], s = (t) => t * t * (3 - 2 * t); return g(xi, yi) * (1 - s(u)) * (1 - s(v)) + g(xi + 1, yi) * s(u) * (1 - s(v)) + g(xi, yi + 1) * (1 - s(u)) * s(v) + g(xi + 1, yi + 1) * s(u) * s(v); };
const fbm = (x, y) => vn(x, y) * .5 + vn(x * 2, y * 2) * .25 + vn(x * 4, y * 4) * .125 + vn(x * 8, y * 8) * .0625;

const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: true});
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, W / H, .1, 2000);

// The sky is a painted equirectangular canvas, used for both the background and the reflections.
const c = document.createElement('canvas'); c.width = 1024; c.height = 512; const g = c.getContext('2d'); const im = g.createImageData(1024, 512);
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
for (let y = 0, i = 0; y < 512; y++) for (let x = 0; x < 1024; x++, i += 4) {
  const e = 1 - y / 256; let col = e < 0 ? [176, 184, 150] : e < .3 ? mix([215, 230, 238], [110, 168, 223], smooth(0, .3, e)) : mix([110, 168, 223], [42, 107, 196], smooth(.3, 1, e));
  if (e > .015) { const n = fbm(x / 96, y / 48), k = smooth(.47, .56, n) * smooth(.015, .14, e); col = mix(col, mix([190, 200, 215], [255, 255, 255], smooth(.5, .62, n)), k * .95); }
  im.data.set([...col, 255], i);
}
g.putImageData(im, 0, 0);
const sky = new THREE.CanvasTexture(c); sky.colorSpace = THREE.SRGBColorSpace; sky.mapping = THREE.EquirectangularReflectionMapping;
scene.background = sky;
const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromEquirectangular(sky).texture; scene.environmentIntensity = .7;
scene.fog = new THREE.Fog('#c5dbe9', 40, 420);
scene.add(new THREE.HemisphereLight('#b9d6ff', '#58603a', 1.1));
const sun = new THREE.DirectionalLight('#fff0d2', 3.1); sun.position.set(-40, 70, 36); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 2.5; sun.shadow.bias = -.0005;
Object.assign(sun.shadow.camera, {left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 220}); scene.add(sun, sun.target);

// Terrain flattens near the subject so feet stay on the ground. Texture magnification is NEAREST.
const height = (x, z) => (fbm(x / 90 + 50, z / 90 + 50) - .47) * 16 * smooth(6, 60, Math.hypot(x, z)) + (fbm(x / 18 + 9, z / 18) - .47);
const geo = new THREE.PlaneGeometry(400, 400, 180, 180); geo.rotateX(-Math.PI / 2);
const a = geo.attributes.position; for (let i = 0; i < a.count; i++) a.setY(i, height(a.getX(i), a.getZ(i))); geo.computeVertexNormals();
const tc = document.createElement('canvas'); tc.width = tc.height = 128; const tg = tc.getContext('2d');
for (let i = 0; i < 128; i++) for (let j = 0; j < 128; j++) { const n = fbm(i / 8, j / 8); tg.fillStyle = `rgb(${50 + n * 90},${90 + n * 110},${25 + n * 40})`; tg.fillRect(i, j, 1, 1); }
const tex = new THREE.CanvasTexture(tc); tex.colorSpace = THREE.SRGBColorSpace; tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.magFilter = THREE.NearestFilter; tex.repeat.set(90, 90);
const ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({map: tex, roughness: .95})); ground.receiveShadow = true; scene.add(ground);

// 26,000 grass blades, three vertices each, in one draw call. Dark at the root, bright at the tip.
const pos = [], col = [], cols = ['#4f8a2a', '#6fa436', '#3b6d22'].map((s) => new THREE.Color(s));
for (let i = 0; i < 26000; i++) {
  const x = (R() - .5) * 64, z = (R() - .5) * 64 - 8, y = height(x, z), ang = R() * TAU, w = .03 + R() * .035, h = .14 + R() * .24, lean = R() * .25, dx = Math.cos(ang) * w, dz = Math.sin(ang) * w, k = cols[Math.floor(R() * 3)];
  pos.push(x - dx, y, z - dz, x + dx, y, z + dz, x + Math.sin(ang) * lean, y + h, z + Math.cos(ang) * lean);
  for (const m of [.6, .6, 1.25]) col.push(k.r * m, k.g * m, k.b * m);
}
const bg = new THREE.BufferGeometry(); bg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); bg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
bg.setAttribute('normal', new THREE.Float32BufferAttribute(pos.map((_, i) => (i % 3 === 1 ? 1 : 0)), 3));   // without normals the AO pass paints this black
const blades = new THREE.Mesh(bg, new THREE.MeshStandardMaterial({vertexColors: true, roughness: .9, side: THREE.DoubleSide})); blades.receiveShadow = true; scene.add(blades);

// A small figure from behind is enough. Capsules read well at this size.
const person = new THREE.Group(), mk = (geom, color, x, y, z) => { const m = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({color, roughness: .8})); m.position.set(x, y, z); m.castShadow = true; person.add(m); return m; };
mk(new THREE.CapsuleGeometry(.19, .34, 4, 12), '#2e5f83', 0, 1.2, 0); mk(new THREE.SphereGeometry(.13, 14, 10), '#3a2416', 0, 1.72, 0); mk(new THREE.BoxGeometry(.3, .42, .17), '#b0542e', 0, 1.27, .21);
const legs = [-1, 1].map((s) => mk(new THREE.CapsuleGeometry(.075, .68, 4, 8), '#39424e', s * .09, .46, 0)); scene.add(person);
for (let i = 0; i < 18; i++) { const an = R() * TAU, d = 50 + R() * 110, x = Math.cos(an) * d, z = -Math.abs(Math.sin(an) * d) - 20, h = 7 + R() * 5, t = new THREE.Group(); t.position.set(x, height(x, z), z);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.2, .35, h * .55, 7), new THREE.MeshStandardMaterial({color: '#4b3626'})); trunk.position.y = h * .27; t.add(trunk);
  for (let k = 0; k < 5; k++) { const b = new THREE.Mesh(new THREE.SphereGeometry(1.5 + R() * .7, 9, 7), new THREE.MeshStandardMaterial({color: '#35691f', roughness: .9})); b.position.set((R() - .5) * 2, h * .68 + (R() - .5), (R() - .5) * 2); t.add(b); } scene.add(t); }

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, {type: THREE.HalfFloatType, samples: 4}));
composer.addPass(new RenderPass(scene, camera));
const gt = new GTAOPass(scene, camera, W, H); gt.updateGtaoMaterial({radius: .35, distanceExponent: 1.4, thickness: 1, scale: 1.25, samples: 12, screenSpaceRadius: false}); gt.blendIntensity = 1; composer.addPass(gt);
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), .35, .55, 1)); composer.addPass(new OutputPass());
renderer.setAnimationLoop((ms) => {
  const t = (ms / 1000) % 40, z = -t * 1.45;
  person.position.set(0, height(0, z), z); person.rotation.y = Math.PI;
  legs.forEach((l, i) => { l.rotation.x = Math.sin(t * 6.2 + i * Math.PI) * .5; });
  camera.position.set(.9, height(0, z + 9) + 1.2, z + 9); camera.lookAt(0, height(0, z) + 5.5, z - 10);
  composer.render();
});
</script></body></html>
