<!doctype html>
<!-- WHAT THIS TEACHES: how to keep people smooth, not robotic. Tapered lathe limbs with rounded ends, a ball hidden at every joint,
     a lathe torso that overlaps the pelvis, and a walk cycle built from sine waves. Left: realistic-low. Right: chibi for cheerful how-tos. -->
<html><head><meta charset="utf-8"><title>05 Smooth character</title>
<style>body{margin:0;background:#111;display:grid;place-items:center;height:100vh}canvas{height:min(96vh,calc(96vw*16/9));aspect-ratio:9/16;image-rendering:pixelated}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const W = 270, H = 480, lerp = (a, b, t) => a + (b - a) * t;
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: true});
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#8fb6d9');
const camera = new THREE.PerspectiveCamera(30, W / H, .1, 100);
scene.add(new THREE.HemisphereLight('#c8ddff', '#6b6048', 1.3));
const sun = new THREE.DirectionalLight('#fff0d2', 2.8); sun.position.set(-4, 8, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 3; sun.shadow.bias = -.0005; Object.assign(sun.shadow.camera, {left: -5, right: 5, top: 5, bottom: -5}); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({color: '#6d8a4f'})); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const mat = (c) => new THREE.MeshStandardMaterial({color: c, roughness: .75});
const mesh = (g, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; return o; };
const group = (x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); return g; };

// A limb hangs down from its joint: rounded top, straight taper, rounded bottom.
function limb(rt, rb, l, m) {
  const p = [new THREE.Vector2(.0001, 0)];
  for (let i = 0; i <= 8; i++) { const a = i / 8 * Math.PI / 2; p.push(new THREE.Vector2(rt * Math.sin(a), rt - rt * Math.cos(a))); }
  for (let i = 1; i <= 4; i++) p.push(new THREE.Vector2(lerp(rt, rb, i / 4), rt + (l - rt - rb) * i / 4));
  for (let i = 1; i <= 6; i++) { const a = i / 6 * Math.PI / 2; p.push(new THREE.Vector2(rb * Math.cos(a), l - rb + rb * Math.sin(a))); }
  const k = mesh(new THREE.LatheGeometry(p, 10), m); k.rotation.x = Math.PI; return k;
}

function person({jacket, pants, skin = '#e0a982', hair = '#3a2416', chibi = false, hat = false, vest = null}) {
  const headR = chibi ? .2 : .125, mj = mat(jacket), mp = mat(pants), ms = mat(skin), root = group(), hips = group(0, .92), spine = group(0, .04);
  root.add(hips); hips.add(spine);
  const torso = mesh(new THREE.LatheGeometry([[.0001, -.11], [.15, -.1], [.158, 0], [.16, .1], [.19, .33], [.195, .42], [.12, .5], [.05, .53], [.0001, .53]].map(([a, b]) => new THREE.Vector2(a, b)), 18), mj); torso.scale.z = .72; spine.add(torso);
  const pelvis = mesh(new THREE.SphereGeometry(.165, 12, 8), mp, 0, -.02); pelvis.scale.set(1, .7, .75); hips.add(pelvis);
  if (vest) { const v = mesh(new THREE.LatheGeometry([[.17, .12], [.2, .33], [.205, .42], [.14, .48]].map(([a, b]) => new THREE.Vector2(a, b)), 14), new THREE.MeshStandardMaterial({color: vest, roughness: .6, side: THREE.DoubleSide})); v.scale.set(1.03, 1, .76); spine.add(v); }
  const neck = group(0, .53); spine.add(neck); neck.add(mesh(new THREE.CylinderGeometry(.05, .055, .09, 8), ms, 0, .03));
  const head = group(0, .07); neck.add(head); head.add(mesh(new THREE.SphereGeometry(headR, 16, 12), ms, 0, headR * .85));
  const cap = mesh(new THREE.SphereGeometry(headR * 1.05, 16, 10, 0, Math.PI * 2, 0, Math.PI * .6), mat(hair), 0, headR * .86, -headR * .05); cap.rotation.x = -.5; head.add(cap);
  for (const s of [-1, 1]) head.add(mesh(new THREE.SphereGeometry(chibi ? .028 : .012, 8, 6), mat('#201810'), s * headR * .38, headR * .9, headR * .9));
  if (hat) { const c = mat('#e8751f'); head.add(mesh(new THREE.SphereGeometry(headR * 1.14, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), c, 0, headR * 1.15), mesh(new THREE.CylinderGeometry(headR * 1.32, headR * 1.32, .02, 16), c, 0, headR * 1.15, .02)); }
  const J = {};
  for (const [side, s] of [['L', 1], ['R', -1]]) {
    const shoulder = group(s * .22, .43); spine.add(shoulder); shoulder.add(limb(.066, .052, .32, mj), mesh(new THREE.SphereGeometry(.07, 10, 8), mj, 0, -.02));
    const elbow = group(0, -.29); shoulder.add(elbow); elbow.add(limb(.052, .042, .3, mj), mesh(new THREE.SphereGeometry(.052, 8, 6), mj), mesh(new THREE.SphereGeometry(.045, 8, 6), ms, 0, -.31));
    const hip = group(s * .09, -.03); hips.add(hip); hip.add(limb(.095, .07, .46, mp), mesh(new THREE.SphereGeometry(.1, 10, 8), mp, 0, -.03));
    const knee = group(0, -.42); hip.add(knee); knee.add(limb(.07, .05, .44, mp), mesh(new THREE.SphereGeometry(.072, 10, 8), mp), mesh(new THREE.BoxGeometry(.1, .075, .25), mat('#22201e'), 0, -.43, .06));
    Object.assign(J, {[`sh${side}`]: shoulder, [`el${side}`]: elbow, [`hip${side}`]: hip, [`kn${side}`]: knee});
  }
  root.walk = (ph) => { const s = Math.sin(ph), c = Math.cos(ph), A = .55;
    J.hipL.rotation.x = s * A; J.hipR.rotation.x = -s * A;
    J.knL.rotation.x = Math.max(0, -c) * A * 1.3 + .08; J.knR.rotation.x = Math.max(0, c) * A * 1.3 + .08;
    J.shL.rotation.set(-s * A * .75, 0, .09); J.shR.rotation.set(s * A * .75, 0, -.09);
    J.elL.rotation.x = J.elR.rotation.x = -.25; hips.position.y = .92 + Math.abs(s) * .025; };
  return root;
}
const a = person({jacket: '#2e5f83', pants: '#39424e'}); a.position.x = -.75; scene.add(a);
const b = person({jacket: '#39424e', pants: '#5b4a3a', chibi: true, hat: true, vest: '#d6ff3f'}); b.position.x = .75; scene.add(b);

camera.position.set(0, 1.1, 8.2); camera.lookAt(0, 1.05, 0);
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, {type: THREE.HalfFloatType, samples: 4}));
composer.addPass(new RenderPass(scene, camera));
const gt = new GTAOPass(scene, camera, W, H); gt.updateGtaoMaterial({radius: .25, distanceExponent: 1.4, thickness: 1, scale: 1.2, samples: 12, screenSpaceRadius: false}); gt.blendIntensity = 1; composer.addPass(gt);
composer.addPass(new OutputPass());
renderer.setAnimationLoop((ms) => { const t = ms / 1000; a.walk(t * 4); b.walk(t * 4 + 1); a.rotation.y = b.rotation.y = t * .5; composer.render(); });
</script></body></html>
