<!doctype html>
<!-- WHAT THIS TEACHES: interiors. A box room with inward walls, ceiling panels that glow only modestly so bloom stays under control,
     point lights hung below the ceiling, and a mood change done purely with light: the panels die one by one toward the viewer. -->
<html><head><meta charset="utf-8"><title>03 Liminal interior</title>
<style>body{margin:0;background:#111;display:grid;place-items:center;height:100vh}canvas{height:min(96vh,calc(96vw*16/9));aspect-ratio:9/16;image-rendering:pixelated}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const W = 270, H = 480, ROOM = {w: 16, d: 60, h: 3};
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: true});
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#000');
const camera = new THREE.PerspectiveCamera(40, W / H, .1, 200);
scene.add(new THREE.HemisphereLight('#fff7e4', '#4a463c', 1.2));

const paint = (size, fn, rx, ry) => { const c = document.createElement('canvas'); c.width = c.height = size; fn(c.getContext('2d'), size); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.NearestFilter; t.repeat.set(rx, ry); return t; };
const carpet = paint(128, (g, s) => { for (let i = 0; i < 4000; i++) { const v = 75 + Math.random() * 45; g.fillStyle = `rgb(${v},${v + 8},${v + 20})`; g.fillRect(Math.random() * s, Math.random() * s, 2, 2); } }, 8, 30);
const paper = paint(128, (g, s) => { g.fillStyle = '#a8a07a'; g.fillRect(0, 0, s, s); g.fillStyle = '#9a926c'; for (let i = 0; i < 8; i++) g.fillRect(i * s / 8, 0, 3, s); }, 30, 2);
const tiles = paint(128, (g, s) => { g.fillStyle = '#bdb9a9'; g.fillRect(0, 0, s, s); g.fillStyle = '#9d998a'; g.fillRect(0, 0, s, 2); g.fillRect(0, 0, 2, s); }, 13, 50);

const plane = (w, h, mat, x, y, z, rx, ry) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); m.receiveShadow = true; scene.add(m); };
const sm = (o) => new THREE.MeshStandardMaterial({roughness: .9, side: THREE.DoubleSide, ...o});
plane(ROOM.w, ROOM.d, sm({map: carpet}), 0, 0, 0, -Math.PI / 2, 0);
plane(ROOM.w, ROOM.d, sm({map: tiles, color: '#6d6a60'}), 0, ROOM.h, 0, Math.PI / 2, 0);           // the ceiling is tinted dark on purpose, or it burns out
for (const s of [-1, 1]) plane(ROOM.d, ROOM.h, sm({map: paper}), s * ROOM.w / 2, ROOM.h / 2, 0, 0, Math.PI / 2);
for (const s of [-1, 1]) plane(ROOM.w, ROOM.h, sm({map: paper}), 0, ROOM.h / 2, s * ROOM.d / 2, 0, 0);

const lights = [];
for (let i = 0; i < 9; i++) {
  const z = -ROOM.d / 2 + 3 + i * (ROOM.d - 6) / 8;
  const panel = new THREE.Mesh(new THREE.BoxGeometry(1.5, .05, .6), new THREE.MeshStandardMaterial({color: '#fff9e6', emissive: '#fff4d6', emissiveIntensity: 1.25}));
  panel.position.set(0, ROOM.h - .03, z); scene.add(panel);
  const L = new THREE.PointLight('#fff3d8', 11, 16, 1.6); L.position.set(0, ROOM.h - .9, z); scene.add(L);
  lights.push({L, panel, z});
}
const grey = new THREE.MeshStandardMaterial({color: '#858a8f', roughness: .85});
for (let z = -26; z < 28; z += 4) for (const x of [-5, 5]) {
  for (const [w, d, ox, oz] of [[3, .06, 0, -1.5], [.06, 3, -1.5, 0], [.06, 3, 1.5, 0]]) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, 1.5, d), grey); m.position.set(x + ox, .75, z + oz); m.castShadow = m.receiveShadow = true; scene.add(m); }
}
const person = new THREE.Group(); scene.add(person);
const part = (g, c, y, z = 0) => { const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color: c, roughness: .8})); m.position.set(0, y, z); person.add(m); };
part(new THREE.CapsuleGeometry(.075, .68, 4, 8), '#39424e', .45, 0); part(new THREE.CapsuleGeometry(.2, .36, 4, 12), '#2e5f83', 1.2); part(new THREE.SphereGeometry(.13, 14, 10), '#3a2416', 1.72); part(new THREE.BoxGeometry(.3, .42, .17), '#b0542e', 1.27, -.21);
person.position.set(0, 0, 8);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, {type: THREE.HalfFloatType, samples: 4}));
composer.addPass(new RenderPass(scene, camera));
const gt = new GTAOPass(scene, camera, W, H); gt.updateGtaoMaterial({radius: .5, distanceExponent: 1.4, thickness: 1, scale: 1.5, samples: 12, screenSpaceRadius: false}); gt.blendIntensity = 1; composer.addPass(gt);
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), .18, .55, 1)); composer.addPass(new OutputPass());

renderer.setAnimationLoop((ms) => {
  const p = ((ms / 1000) % 6) / 5;            // loops every 6 s
  lights.forEach(({L, panel}, i) => { const on = p > .28 + (i / 9) * .7 ? 0 : 1; L.intensity = 11 * on; panel.material.emissiveIntensity = 1.25 * on; });
  camera.position.set(0, 1.3, 1.2 + Math.min(p, 1)); camera.lookAt(0, 2.1, 28);
  composer.render();
});
</script></body></html>
