<!doctype html>
<!-- WHAT THIS TEACHES: the look of the "how to build" format. A ground cutaway made from stacked boxes with labels, a giant comedic prop,
     bright primary colours, hard cuts every two seconds. Three shots loop so you can see the pace. -->
<html><head><meta charset="utf-8"><title>07 Cutaway how-to</title>
<style>body{margin:0;background:#111;display:grid;place-items:center;height:100vh}canvas{height:min(96vh,calc(96vw*16/9));aspect-ratio:9/16;image-rendering:pixelated}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const W = 270, H = 480, SHOT_SECONDS = 2;
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: true});
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const mat = (c, o = {}) => new THREE.MeshStandardMaterial({color: c, roughness: .75, ...o});
const label = (text, bg = '#1b1b1b', fg = '#ffd628') => { const c = document.createElement('canvas'); c.width = 256; c.height = 64; const g = c.getContext('2d'); g.fillStyle = bg; g.fillRect(0, 0, 256, 64); g.fillStyle = fg; g.font = 'bold 38px monospace'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 128, 34); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; return t; };

function world() {
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#7ec3f2'); scene.fog = new THREE.Fog('#bfe0f5', 40, 200);
  scene.add(new THREE.HemisphereLight('#d7e9ff', '#7a6b4a', 1.3));
  const s = new THREE.DirectionalLight('#fff4dc', 3); s.position.set(-14, 26, 18); s.castShadow = true; s.shadow.mapSize.set(2048, 2048); s.shadow.radius = 2.5; s.shadow.bias = -.0005; Object.assign(s.shadow.camera, {left: -24, right: 24, top: 24, bottom: -24, far: 80}); scene.add(s);
  const add = (w, h, d, m, x, y, z) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; scene.add(o); return o; };
  return {scene, add};
}

// Shot 1: the layers of a road, cut open. Each band is just a box.
const s1 = (() => { const {scene, add} = world(); let y = 0;
  const parts = [[.4, '#2c2d31', 'ASPHALT'], [1, '#8a8c8f', 'GRAVEL'], [1.6, '#a98a5e', 'SAND'], [3.5, '#6f4f33', 'SOIL']].map(([h, c, t]) => { add(10, h, 8, mat(c), 0, y - h / 2, 0); const sign = new THREE.Mesh(new THREE.PlaneGeometry(2.6, .65), new THREE.MeshBasicMaterial({map: label(t)})); sign.position.set(0, y - h / 2, 4.01); scene.add(sign); y -= h; });
  return {scene, cam: (p, c) => { c.position.set(0, -1.5, 25 - p * 1.5); c.lookAt(0, 1.4, 0); }}; })();

// Shot 2: a giant roller beside a tiny worker. Scale is the joke.
const s2 = (() => { const {scene, add} = world(); add(90, .3, 90, mat('#3a3b40'), 0, -.15, 0);
  const drum = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 8, 20), mat('#f2b632', {metalness: .3, roughness: .4})); drum.rotation.z = Math.PI / 2; drum.position.set(0, 4, -6); drum.castShadow = true; scene.add(drum);
  add(9, 3, 7, mat('#e8751f'), 0, 9.3, -6);
  const w = new THREE.Group(); const b = new THREE.Mesh(new THREE.CapsuleGeometry(.2, .9, 4, 10), mat('#d6ff3f')); b.position.y = .75; b.castShadow = true; const h = new THREE.Mesh(new THREE.SphereGeometry(.26, 14, 8), mat('#e8751f')); h.position.y = 1.55; w.add(b, h); w.position.set(.2, 0, 4); scene.add(w);
  return {scene, cam: (p, c) => { drum.position.z = -6 + p * 3; drum.rotation.x = p * 2; c.position.set(2, 1, 13); c.lookAt(0, 6.6, -4); }}; })();

// Shot 3: a stop sign in the rain, and the finished road.
const s3 = (() => { const {scene, add} = world(); scene.background = new THREE.Color('#8b98a6'); scene.fog = new THREE.Fog('#8b98a6', 15, 90);
  add(10, .3, 200, mat('#2c2d31'), 0, -.15, 0); add(200, .2, 200, mat('#5f8b3a'), 0, -.32, 0);
  for (let z = 0; z > -140; z -= 7) add(.18, .02, 3, mat('#e8e3c8'), 0, .02, z);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(3, 1), new THREE.MeshStandardMaterial({map: label('DONE!', '#1a5c34', '#ffffff')})); sign.position.set(-2.2, 3.2, -6); scene.add(sign); add(.14, 3.2, .14, mat('#26272b'), -2.2, 1.6, -6.1);
  const n = 900, verts = new Float32Array(n * 6), seedData = Array.from({length: n}, () => [Math.random() * 30 - 15, Math.random() * 18, Math.random() * 30 - 22]);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(verts, 3)); const l = new THREE.LineSegments(g, new THREE.LineBasicMaterial({color: '#c9d6e3', transparent: true, opacity: .55})); l.frustumCulled = false; scene.add(l);
  return {scene, cam: (p, c) => { seedData.forEach(([x, y, z], i) => { const Y = ((y - p * 34) % 18 + 18) % 18; verts.set([x, Y, z, x, Y + .4, z], i * 6); }); g.attributes.position.needsUpdate = true; c.position.set(.8, 1.4, 12 - p); c.lookAt(0, 5.8, -30); }}; })();

const camera = new THREE.PerspectiveCamera(40, W / H, .1, 400);
const shots = [s1, s2, s3].map((s) => { const c = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, {type: THREE.HalfFloatType, samples: 4})); c.addPass(new RenderPass(s.scene, camera)); const g = new GTAOPass(s.scene, camera, W, H); g.updateGtaoMaterial({radius: .35, distanceExponent: 1.4, thickness: 1, scale: 1.25, samples: 12, screenSpaceRadius: false}); g.blendIntensity = 1; c.addPass(g); c.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), .25, .55, 1)); c.addPass(new OutputPass()); return {...s, c}; });
renderer.setAnimationLoop((ms) => { const t = ms / 1000 / SHOT_SECONDS, i = Math.floor(t) % shots.length, p = t % 1; shots[i].cam(p, camera); shots[i].c.render(); });
</script></body></html>
